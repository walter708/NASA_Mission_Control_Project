name: Disposable evaluation
on:
  push:
    branches: [main, disposable-evaluation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.16
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --tmpfs /data/db
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: true
      EVALUATION_MODE: true
      MONGO_URL: mongodb://127.0.0.1:27017/nasa_evaluation
      LAUNCH_DATA_SOURCE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked API dependencies
        run: npm ci --prefix server
      - name: API tests and startup with external network blocked
        shell: bash
        run: |
          set -euo pipefail
          runner_uid=$(id -u)
          server_pid=""
          cleanup() {
            sudo iptables -D OUTPUT ! -o lo -m owner --uid-owner "$runner_uid" -j REJECT || true
            sudo ip6tables -D OUTPUT ! -o lo -m owner --uid-owner "$runner_uid" -j REJECT || true
            if [ -n "$server_pid" ]; then kill "$server_pid" || true; fi
          }
          trap cleanup EXIT
          sudo iptables -I OUTPUT 1 ! -o lo -m owner --uid-owner "$runner_uid" -j REJECT
          sudo ip6tables -I OUTPUT 1 ! -o lo -m owner --uid-owner "$runner_uid" -j REJECT
          node -e 'fetch("https://api.spacexdata.com").then(() => process.exit(1), () => console.log("PASS: external network blocked"))'
          npm run test --prefix server -- --runInBand
          (cd server && exec node src/server.js) &
          server_pid=$!
          node server/test/smoke-evaluation.js
          node server/test/reproduce-abort.js
          echo '### Disposable evaluation passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'API tests and application startup passed with external network blocked. MongoDB uses ephemeral storage and is destroyed with the runner.' >> "$GITHUB_STEP_SUMMARY"

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - run: npm run test --prefix client -- --watchAll=false
